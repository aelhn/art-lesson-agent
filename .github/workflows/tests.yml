# Nom affiché dans l'onglet Actions de GitHub
name: Tests

# Quand lancer la CI : à chaque push et à chaque pull request
on: [push, pull_request]

jobs:
  # 1er travail : les tests pytest
  tests:
    runs-on: ubuntu-latest   # une machine Linux fournie par GitHub
    steps:
      # Récupère le code du repo
      - uses: actions/checkout@v5

      # Installe Python 3.13
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Installe les dépendances du projet
      - run: pip install -r requirements.txt

      # Lance les tests (sans réseau ni Claude, grâce aux faux)
      - run: pytest

  # 2e travail : vérifie que l'image Docker du serveur MCP se construit
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t art-lesson-mcp .